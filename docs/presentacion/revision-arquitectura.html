<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Revisión de Arquitectura</title>
<meta name="description" content="Cómo revisa Arquitectura un pedido de proyecto, paso a paso, explicado sin tecnicismos.">
<style>
  :root {
    --bg: #f6f7f9; --surface: #ffffff; --text: #1d2330; --muted: #5c6577; --line: #d9dee7;
    --accent: #2f6fde; --accent-soft: #e6eefc; --ok: #1f8a5b; --warn: #b7791f; --phase: #6b4fbb;
    --actor-off: #eef0f4; --actor-on: #ffffff; --shadow: 0 6px 24px rgba(20, 30, 60, .08);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #12151b; --surface: #1a1f28; --text: #e7eaf0; --muted: #9aa3b5; --line: #2c3442;
      --accent: #6aa0ff; --accent-soft: #1f2d48; --ok: #4cc38a; --warn: #e3a63c; --phase: #a78bfa;
      --actor-off: #202734; --actor-on: #263043; --shadow: 0 6px 24px rgba(0, 0, 0, .35);
    }
  }
  :root[data-theme="dark"] {
    --bg: #12151b; --surface: #1a1f28; --text: #e7eaf0; --muted: #9aa3b5; --line: #2c3442;
    --accent: #6aa0ff; --accent-soft: #1f2d48; --ok: #4cc38a; --warn: #e3a63c; --phase: #a78bfa;
    --actor-off: #202734; --actor-on: #263043; --shadow: 0 6px 24px rgba(0, 0, 0, .35);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column; min-height: 100vh;
  }
  header { display: flex; align-items: center; justify-content: space-between; padding: 14px 24px; gap: 12px; }
  header h1 { font-size: 15px; font-weight: 600; margin: 0; color: var(--muted); letter-spacing: .02em; }
  .theme { background: none; border: 1px solid var(--line); color: var(--muted); border-radius: 8px; padding: 6px 10px;
           cursor: pointer; font: inherit; font-size: 13px; }

  main { flex: 1; display: flex; flex-direction: column; align-items: center; padding: 0 16px 16px; }
  .deck { width: 100%; max-width: 1100px; display: flex; flex-direction: column; gap: 16px; }

  /* Stage: the cast of the process, with a message travelling between them */
  .stage { position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: 16px;
           box-shadow: var(--shadow); padding: 18px 12px 56px; overflow-x: auto; overflow-y: hidden; }
  .cast { display: grid; grid-template-columns: repeat(7, minmax(96px, 1fr)); gap: 10px; min-width: 720px; position: relative; }
  .actor { background: var(--actor-off); border: 2px solid transparent; border-radius: 12px; padding: 10px 8px;
           text-align: center; opacity: .45; transition: all .35s ease; }
  .actor.on { opacity: 1; background: var(--actor-on); border-color: var(--accent); transform: translateY(-3px); }
  .actor svg { width: 30px; height: 30px; display: block; margin: 0 auto 6px; color: var(--accent); }
  .actor b { display: block; font-size: 13px; line-height: 1.25; }
  .actor .short { display: none; }
  .actor small { display: block; font-size: 11px; color: var(--muted); line-height: 1.25; margin-top: 2px; }
  .msg { position: absolute; top: 0; left: 0; max-width: 220px; background: var(--accent); color: #fff;
         font-size: 12.5px; line-height: 1.3; padding: 6px 10px; border-radius: 999px; white-space: nowrap;
         overflow: hidden; text-overflow: ellipsis; box-shadow: var(--shadow); opacity: 0; pointer-events: none;
         transition: transform 1.1s cubic-bezier(.45, .05, .25, 1), opacity .3s ease; z-index: 2; }
  .msg.show { opacity: 1; }
  .msg.back { background: var(--ok); }

  /* Slide */
  .slide { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow);
           padding: 28px 32px; min-height: 280px; display: flex; flex-direction: column; gap: 10px; }
  .phase { display: inline-block; align-self: flex-start; font-size: 12px; font-weight: 700; letter-spacing: .08em;
           text-transform: uppercase; color: var(--phase); background: var(--accent-soft); padding: 4px 10px;
           border-radius: 999px; }
  .slide h2 { font-size: clamp(22px, 3.2vw, 32px); line-height: 1.2; margin: 4px 0 2px; }
  .slide p { font-size: clamp(16px, 1.9vw, 19px); margin: 0; color: var(--text); max-width: 62ch; }
  .slide ul { margin: 4px 0 0; padding-left: 1.2em; font-size: clamp(15px, 1.8vw, 18px); max-width: 66ch; }
  .slide li { margin: 4px 0; }
  .example { margin-top: 6px; background: var(--accent-soft); border-radius: 12px; padding: 12px 14px;
             font-size: clamp(14px, 1.7vw, 16px); max-width: 70ch; }
  .example b.lbl { display: block; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--accent);
                   margin-bottom: 2px; }
  .chip { display: inline-block; font-size: 11.5px; font-weight: 700; border-radius: 999px; padding: 2px 9px;
          margin-left: 8px; vertical-align: middle; color: #fff; }
  .chip.hecho { background: var(--ok); } .chip.ahora { background: var(--warn); } .chip.proximo { background: var(--muted); }
  .note { margin-top: auto; font-size: 14px; color: var(--muted); border-left: 3px solid var(--warn); padding: 4px 0 4px 10px; }
  .fade { animation: fade .45s ease; }
  @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  /* Controls */
  .controls { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: center; }
  .controls button { background: var(--surface); color: var(--text); border: 1px solid var(--line); border-radius: 10px;
                     padding: 9px 14px; font: inherit; font-size: 15px; cursor: pointer; min-width: 44px; }
  .controls button.primary { background: var(--accent); border-color: var(--accent); color: #fff; min-width: 120px; }
  .controls button:disabled { opacity: .4; cursor: default; }
  .count { font-size: 14px; color: var(--muted); min-width: 64px; text-align: center; }
  .bar { height: 4px; background: var(--line); border-radius: 4px; overflow: hidden; }
  .bar span { display: block; height: 100%; width: 0; background: var(--accent); }
  .dots { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
  .dots button { width: 12px; height: 12px; border-radius: 50%; border: none; padding: 0; background: var(--line); cursor: pointer; }
  .dots button.on { background: var(--accent); }
  .hint { text-align: center; font-size: 12.5px; color: var(--muted); }

  @media (max-width: 640px) {
    header { padding: 12px 16px; }
    .slide { padding: 20px 18px; min-height: 0; }
    /* Compact cast: every actor fits, so the travelling message is always in view */
    .stage { padding: 12px 6px 46px; overflow: hidden; }
    .cast { grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; min-width: 0; }
    .actor { padding: 8px 2px; border-radius: 10px; }
    .actor svg { width: 22px; height: 22px; margin-bottom: 4px; }
    .actor b { font-size: 10.5px; }
    .actor .long, .actor small { display: none; }
    .actor .short { display: inline; }
    .msg { font-size: 11px; max-width: 150px; padding: 4px 8px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .msg, .actor, .fade { transition: none; animation: none; }
  }
</style>
</head>
<body>
<header>
  <h1>Revisión de Arquitectura · el caso de los modelos de IA locales</h1>
  <button class="theme" id="theme" type="button" aria-label="Cambiar tema claro u oscuro">Tema</button>
</header>
<main>
  <div class="deck">
    <section class="stage" aria-label="Quiénes participan">
      <div class="cast" id="cast"></div>
      <div class="msg" id="msg" aria-hidden="true"></div>
    </section>

    <article class="slide" id="slide" aria-live="polite"></article>

    <div class="bar" aria-hidden="true"><span id="bar"></span></div>
    <div class="controls">
      <button id="prev" type="button">◀ Anterior</button>
      <button id="play" type="button" class="primary">▶ Reproducir</button>
      <button id="next" type="button">Siguiente ▶</button>
      <span class="count" id="count"></span>
    </div>
    <div class="dots" id="dots" aria-label="Ir a una diapositiva"></div>
    <div class="hint">Teclado: ← → para moverte · espacio para reproducir o pausar</div>
  </div>
</main>

<script>
const ICON = {
  person: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg>',
  inbox: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 13l3-8h12l3 8v6H3z"/><path d="M3 13h5l1 2h6l1-2h5"/></svg>',
  team: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="8" cy="9" r="3"/><circle cx="16" cy="9" r="3"/><path d="M2 20c0-3 2.7-5 6-5s6 2 6 5M12 20c0-3 2.2-5 5-5s5 2 5 5"/></svg>',
  lens: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21"/></svg>',
  pen: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 20l4-1L20 7l-3-3L5 16z"/><path d="M14 6l3 3"/></svg>',
  board: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16M15 4v16"/></svg>',
  chat: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 5h16v11H9l-5 4z"/></svg>',
};

const ACTORS = [
  { id: "req", name: "Quien pide", short: "Pide", sub: "el equipo que necesita algo", icon: "person" },
  { id: "pry", name: "Plataforma de pedidos", short: "Pedidos", sub: "donde se carga el pedido", icon: "inbox" },
  { id: "coord", name: "Coordinación", short: "Coord.", sub: "ordena y comunica", icon: "team" },
  { id: "arq", name: "Arquitectura", short: "Arq.", sub: "analiza y propone", icon: "lens" },
  { id: "firma", name: "Quien firma", short: "Firma", sub: "responde por la decisión", icon: "pen" },
  { id: "tablero", name: "Tablero del equipo", short: "Tablero", sub: "las tareas a la vista", icon: "board" },
  { id: "ticket", name: "Ticket del pedido", short: "Ticket", sub: "la conversación", icon: "chat" },
];

// Each slide: phase, title, body (HTML), who is involved, and the messages that travel (from → to).
const SLIDES = [
  { phase: "Introducción", title: "Cómo revisa Arquitectura un pedido de proyecto",
    body: "<p>Lo recorremos con un pedido real, de punta a punta: desde que alguien lo carga hasta que recibe una respuesta clara, con recomendaciones y una decisión firmada.</p>",
    ex: "<b>Prueba de modelos de inteligencia artificial propios</b> (pedido PRY-2026-0028): ver si correr modelos en un servidor propio cuesta menos que pagar Cursor y GitHub Copilot.",
    on: [], steps: [] },
  { phase: "El punto de partida", title: "Los pedidos llegan con muy poca información",
    body: "<ul><li>Quien pide suele describir lo que quiere en pocas líneas, sin datos para evaluarlo.</li><li>Cuatro áreas tienen que validarlo: Cloud, Arquitectura, Seguridad y FinOps.</li><li>La plataforma solo permite <b>aprobar o rechazar</b>, y no tiene dónde conversar.</li></ul>",
    ex: "El pedido decía, en una línea: <i>“Habilitar un servidor con GPU”</i>, y que se esperaba ahorrar frente a las herramientas pagas. No decía cuánto se gasta hoy, cuánto tiempo dura la prueba ni quién la usaría.",
    note: "Por eso armamos un proceso que pide lo que falta, conversa en un lugar visible y deja todo registrado.",
    on: ["req", "pry"], steps: [] },
  { phase: "Quiénes participan", title: "Siete protagonistas, cada uno con su rol",
    body: "<p>Arriba están todos. En cada paso se iluminan los que intervienen y un mensaje muestra qué se pasan entre ellos.</p>",
    ex: "Quien pide: <b>Juan Pablo Fernández</b>, del equipo de Plataforma. Su responsable: <b>Felipe López</b>, que recibe los avisos del ticket.",
    note: "Coordinación y Arquitectura pueden ser dos personas distintas o la misma con dos sombreros.",
    on: ACTORS.map(a => a.id), steps: [] },
  { phase: "1 · Llega el pedido", status: "hecho", title: "Alguien carga su pedido en la plataforma",
    body: "<p>El pedido queda en la bandeja de Arquitectura, esperando revisión.</p>",
    ex: "Juan Pablo lo cargó el <b>6 de octubre</b>.",
    on: ["req", "pry", "coord"],
    steps: [{ from: "req", to: "pry", text: "Servidor con GPU" }, { from: "pry", to: "coord", text: "Pedido pendiente" }] },
  { phase: "1 · Llega el pedido", status: "hecho", title: "Se registra tal cual llegó",
    body: "<p>Coordinación copia el pedido <b>sin resumirlo ni corregirlo</b>: es la evidencia de lo que se pidió.</p>",
    ex: "Se copió textual, incluso un dato para revisar más adelante: la memoria que el pedido le atribuye a la GPU no coincide con la del modelo nombrado.",
    on: ["coord"], steps: [] },
  { phase: "2 · Clasificación", status: "hecho", title: "¿Es un pedido simple o complejo?",
    body: "<p>Seis preguntas de sí o no: ¿lo usan varias cuentas o empresas? ¿Es una migración? ¿La fecha es comprometida? ¿Hay otros equipos? ¿Hay datos sensibles o inteligencia artificial de terceros? ¿Queda en producción?</p><p>Un solo “sí” lo vuelve <b>complejo</b>. Ante la duda, se contesta que sí.</p>",
    ex: "Dos “sí”: el servicio lo podrían usar <b>otras cuentas y empresas</b> del grupo, y el pedido <b>no dice cuánto dura</b>. Resultado: <b>complejo</b>.",
    note: "Un pedido complejo lo firma el referente senior; uno simple, alguien del equipo técnico.",
    on: ["coord"], steps: [] },
  { phase: "3 · Se abren los canales", status: "hecho", title: "Un tablero para el equipo y un ticket para quien pide",
    body: "<ul><li>En el <b>tablero</b> aparece el pedido con sus tareas, en orden.</li><li>Se abre un <b>ticket a nombre de quien pide</b>: ahí se conversa, y le llegan los avisos.</li><li>Empieza a correr un plazo de <b>10 días hábiles</b> para completar la información.</li></ul>",
    ex: "Tablero: ficha <b>PLATE-614</b> con 3 etapas y 8 tareas. Ticket: <b>PEHD-86</b>, a nombre de Juan Pablo. Plazo: <b>21 de octubre</b>.",
    on: ["coord", "tablero", "ticket", "req"],
    steps: [{ from: "coord", to: "tablero", text: "PLATE-614 y sus tareas" }, { from: "coord", to: "ticket", text: "PEHD-86 para Juan Pablo" }] },
  { phase: "4 · ¿Está todo?", status: "hecho", title: "Se revisa si el pedido trae lo mínimo para evaluarlo",
    body: "<p>Arquitectura compara el pedido con una lista de datos mínimos: qué problema resuelve, cómo se mide el éxito, cuánto cuesta, cuánto dura, quién es responsable, cómo vuelve atrás si algo sale mal…</p>",
    ex: "Faltaban <b>10 de 13 datos</b>. Entre ellos: cuánto se gasta hoy en Cursor y Copilot y qué ahorro haría exitosa la prueba, cuándo se apaga el servidor, cuánto cuesta por mes, y cómo lo usarían otras cuentas sin exponerlo a internet.",
    on: ["arq"], steps: [] },
  { phase: "4 · ¿Está todo?", status: "hecho", title: "Si falta algo, se pregunta en concreto",
    body: "<p>Quien pide recibe en su ticket <b>preguntas específicas para su caso</b>, y por qué se necesita cada dato. El tablero se actualiza solo con lo que se encontró.</p>",
    ex: "El <b>8 de octubre</b> Juan Pablo recibió <b>11 preguntas</b> en PEHD-86, y la ficha PLATE-614 muestra qué falta y por qué.",
    on: ["arq", "coord", "ticket", "req", "tablero"],
    steps: [{ from: "arq", to: "coord", text: "11 preguntas listas" }, { from: "coord", to: "ticket", text: "Preguntas en PEHD-86" }, { from: "coord", to: "tablero", text: "Resumen en PLATE-614" }] },
  { phase: "4 · ¿Está todo?", status: "ahora", title: "Quien pide responde, y se repite hasta completar",
    body: "<p>Cada respuesta se revisa. Si sigue faltando algo, hay otra ronda de preguntas.</p>",
    ex: "<b>Estamos acá:</b> esperando la respuesta de Juan Pablo, hasta el 21 de octubre.",
    note: "Si vence el plazo sin respuesta, el pedido se cierra como incompleto y se puede volver a cargar cuando esté listo.",
    on: ["req", "ticket", "arq"],
    steps: [{ from: "req", to: "ticket", text: "Acá está la info", back: true }, { from: "ticket", to: "arq", text: "Respuesta", back: true }] },
  { phase: "5 · Análisis", status: "proximo", title: "Se evalúa contra reglas publicadas, no opiniones",
    body: "<ul><li>Cada parte del pedido se contrasta con las <b>reglas de Arquitectura</b> (por ejemplo: todo en la nube aprobada, nada creado por fuera de la plataforma interna).</li><li>Si la propuesta original es viable, se conserva y se suman <b>dos alternativas</b> para su punto más débil.</li><li>Se dejan <b>avisos</b> para Cloud, Seguridad y FinOps, sin decidir por ellos.</li></ul>",
    ex: "Lo más débil hasta ahora es el <b>costo</b>: un servidor con GPU encendido todo el día cuesta del orden de <b>US$1.300 por mes</b> (a confirmar). Una alternativa posible: encenderlo solo en horario laboral. FinOps y Cloud ya tienen un aviso.",
    on: ["arq", "tablero"],
    steps: [{ from: "arq", to: "tablero", text: "Análisis y alternativas" }] },
  { phase: "6 · Firma", status: "proximo", title: "Una persona responde por la decisión",
    body: "<p>Quien firma revisa el análisis completo. Si está de acuerdo, firma; si pide cambios, vuelve a análisis y <b>la firma se anula</b>: nunca se firma una cosa y se publica otra.</p>",
    ex: "Como el pedido es complejo, lo firma el <b>referente senior</b> de Arquitectura.",
    on: ["arq", "firma"],
    steps: [{ from: "arq", to: "firma", text: "Propuesta para firmar" }, { from: "firma", to: "arq", text: "Firmado", back: true }] },
  { phase: "7 · Devolución", status: "proximo", title: "Quien pide recibe una respuesta clara",
    body: "<p>En su ticket llega la decisión con <b>recomendaciones</b> y, si las hay, las <b>condiciones</b> para avanzar. Cada condición se convierte en una tarea de seguimiento en el tablero.</p>",
    ex: "Ilustrativo: “Aprobado con condiciones: apagar el servidor fuera de horario y fijar un presupuesto con alerta”. Cada condición sería una tarea de seguimiento en PLATE-614.",
    on: ["coord", "ticket", "req", "tablero"],
    steps: [{ from: "coord", to: "ticket", text: "Devolución en PEHD-86" }, { from: "coord", to: "tablero", text: "Seguimiento" }, { from: "ticket", to: "req", text: "Respuesta final" }] },
  { phase: "8 · Decisión formal", status: "proximo", title: "Una persona aprueba o rechaza en la plataforma",
    body: "<p>El botón de <b>Aprobar o Rechazar</b> lo toca siempre una persona, nunca la herramienta. “Aprobar con condiciones” se registra como aprobado, con las condiciones en el comentario.</p>",
    ex: "La decisión sobre PRY-2026-0028 la registra una persona en la plataforma de pedidos.",
    on: ["firma", "pry"],
    steps: [{ from: "firma", to: "pry", text: "Aprobado" }] },
  { phase: "9 · Cierre", status: "proximo", title: "Todo queda registrado y a la vista",
    body: "<p>El tablero muestra el resumen final, el ticket tiene toda la conversación y el análisis completo queda guardado con su historia.</p>",
    ex: "PLATE-614 quedará con la decisión final y PEHD-86 con toda la conversación con Juan Pablo.",
    on: ["tablero", "ticket", "coord"],
    steps: [{ from: "coord", to: "tablero", text: "Resumen final" }] },
  { phase: "Lo que garantiza", title: "Cuatro reglas que el proceso cumple siempre",
    body: "<ul><li><b>Nada se publica sin firma.</b> Una respuesta no puede salir antes de que alguien responda por ella.</li><li><b>Nada se crea a nombre de otra persona.</b> El ticket es de quien pide, y si no se puede confirmar quién es, no se crea.</li><li><b>Nada se duplica.</b> Repetir un paso no genera tareas ni mensajes repetidos.</li><li><b>Todo es trazable.</b> Cada decisión cita la regla que la sostiene.</li></ul>",
    on: ACTORS.map(a => a.id), steps: [] },
];

const SLIDE_MS = 9000, STEP_MS = 1800;
const $ = id => document.getElementById(id);
const cast = $("cast"), msg = $("msg"), slideEl = $("slide");
let index = 0, playing = false, timer = null, started = 0, raf = null, stepTimers = [];

cast.innerHTML = ACTORS.map(a =>
  `<div class="actor" id="a-${a.id}" title="${a.name}: ${a.sub}">${ICON[a.icon]}<b><span class="long">${a.name}</span><span class="short">${a.short}</span></b><small>${a.sub}</small></div>`).join("");
$("dots").innerHTML = SLIDES.map((_, i) => `<button type="button" aria-label="Diapositiva ${i + 1}"></button>`).join("");
[...$("dots").children].forEach((dot, i) => dot.addEventListener("click", () => go(i)));

function center(id) {
  const stage = cast.parentElement.getBoundingClientRect(), box = $("a-" + id).getBoundingClientRect();
  return { x: box.left - stage.left + cast.parentElement.scrollLeft + box.width / 2, y: box.bottom - stage.top + 4 };
}

function animate(steps) {
  stepTimers.forEach(clearTimeout); stepTimers = [];
  msg.classList.remove("show");
  steps.forEach((step, n) => {
    stepTimers.push(setTimeout(() => {
      const a = center(step.from), b = center(step.to), stage = cast.parentElement;
      // Keep the message in view on narrow screens: center the stage between sender and receiver.
      stage.scrollTo({ left: Math.max(0, (a.x + b.x) / 2 - stage.clientWidth / 2), behavior: "smooth" });
      msg.style.transition = "none";
      msg.textContent = step.text;
      msg.classList.toggle("back", !!step.back);
      const w = msg.offsetWidth, maxX = stage.scrollWidth - w - 4;
      const clamp = x => Math.max(4, Math.min(maxX, x - w / 2));
      msg.style.transform = `translate(${clamp(a.x)}px, ${a.y}px)`;
      msg.offsetWidth; // restart the transition from the new origin
      msg.style.transition = "";
      msg.classList.add("show");
      requestAnimationFrame(() => { msg.style.transform = `translate(${clamp(b.x)}px, ${b.y}px)`; });
    }, 350 + n * STEP_MS));
  });
  if (steps.length) stepTimers.push(setTimeout(() => msg.classList.remove("show"), 350 + steps.length * STEP_MS));
}

function render() {
  const s = SLIDES[index];
  slideEl.classList.remove("fade"); void slideEl.offsetWidth; slideEl.classList.add("fade");
  const chip = s.status ? `<span class="chip ${s.status}">${{ hecho: "Hecho", ahora: "Estamos acá", proximo: "Próximo" }[s.status]}</span>` : "";
  slideEl.innerHTML = `<span class="phase">${s.phase}${chip}</span><h2>${s.title}</h2>${s.body}` +
    (s.ex ? `<div class="example"><b class="lbl">En el ejemplo</b>${s.ex}</div>` : "") +
    (s.note ? `<div class="note">${s.note}</div>` : "");
  ACTORS.forEach(a => $("a-" + a.id).classList.toggle("on", s.on.includes(a.id)));
  // On narrow screens the cast scrolls sideways: bring the first actor of this slide into view.
  const stage = cast.parentElement, first = s.on.length && s.on.length < ACTORS.length ? $("a-" + s.on[0]) : null;
  stage.scrollTo({ left: first ? Math.max(0, first.offsetLeft - 12) : 0, behavior: "smooth" });
  [...$("dots").children].forEach((d, i) => d.classList.toggle("on", i === index));
  $("count").textContent = `${index + 1} / ${SLIDES.length}`;
  $("prev").disabled = index === 0;
  $("next").disabled = index === SLIDES.length - 1;
  setTimeout(() => animate(s.steps), 300);
  restartTimer();
}

function go(i) { index = Math.max(0, Math.min(SLIDES.length - 1, i)); render(); }

function restartTimer() {
  clearTimeout(timer); cancelAnimationFrame(raf); $("bar").style.width = "0";
  if (!playing) return;
  const duration = Math.max(SLIDE_MS, 600 + SLIDES[index].steps.length * STEP_MS + 2500);
  started = performance.now();
  const tick = now => { $("bar").style.width = Math.min(100, (now - started) / duration * 100) + "%"; raf = requestAnimationFrame(tick); };
  raf = requestAnimationFrame(tick);
  timer = setTimeout(() => {
    if (index < SLIDES.length - 1) go(index + 1); else setPlaying(false);
  }, duration);
}

function setPlaying(on) {
  playing = on;
  $("play").textContent = on ? "❚❚ Pausar" : "▶ Reproducir";
  if (on && index === SLIDES.length - 1) { go(0); return; }
  restartTimer();
}

$("prev").addEventListener("click", () => go(index - 1));
$("next").addEventListener("click", () => go(index + 1));
$("play").addEventListener("click", () => setPlaying(!playing));
document.addEventListener("keydown", e => {
  if (e.key === "ArrowRight") go(index + 1);
  else if (e.key === "ArrowLeft") go(index - 1);
  else if (e.key === " ") { e.preventDefault(); setPlaying(!playing); }
});
document.addEventListener("visibilitychange", () => { if (document.hidden && playing) setPlaying(false); });
window.addEventListener("resize", () => animate(SLIDES[index].steps));

$("theme").addEventListener("click", () => {
  const root = document.documentElement;
  const dark = root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  root.dataset.theme = dark ? "light" : "dark";
});

render();
</script>
</body>
</html>
